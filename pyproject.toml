[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest-cleanup"
version = "0.1.0"
description = "Safely remove verified preserved ingest sources"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ingest-cleanup = "ingest_cleanup.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
